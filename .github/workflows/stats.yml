# Rebuilds the stats.exe card from live GitHub data and publishes it to the `output` branch.
# The README loads it from https://raw.githubusercontent.com/<owner>/<repo>/output/stats.svg
name: stats

on:
  schedule:
    - cron: "17 0 * * *" # daily, 07:17 Bangkok time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build stats.svg and stats-still.svg
        run: node scripts/build-stats.mjs --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}

      - name: Publish to the output branch
        working-directory: dist
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg stats-still.svg
          git commit -q -m "Update stats.svg"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
